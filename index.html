<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صالة الهرم التجارية - نظام الرواتب والموارد البشرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EBEEF2; --surface:#fff; --ink:#16233B; --muted:#5E6A7C; --line:#D8DDE5; --soft:#F4F6F9;
  --navy:#16233B; --navy2:#223556; --gold:#C79A3B; --gold-soft:#F7EDD3;
  --green:#1E7B66; --green-soft:#E1F2ED; --red:#B4372D; --red-soft:#F9E5E2; --blue:#2D5BA8; --blue-soft:#E3ECF8;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{padding-bottom:42px;font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
.app{display:flex;min-height:100%}
.side{width:224px;background:var(--navy);color:#DCE3EF;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 42px);flex:none}
.brand{display:flex;gap:10px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid #2C3E5F}
.brand svg{flex:none}
.brand b{display:block;font-size:15px;color:#fff;line-height:1.3}
.brand span{font-size:12px;color:#9FB0CB}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#C5D0E2;padding:10px 12px;border-radius:var(--r);cursor:pointer;text-align:right;font-size:14px}
.nav button:hover{background:var(--navy2);color:#fff}
.nav button.on{background:var(--gold);color:#1B1405;font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;padding:14px 18px;font-size:12px;color:#9FB0CB;border-top:1px solid #2C3E5F}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{font-size:18px}
.top .sp{flex:1}
#saveState{font-size:12px;color:var(--green);opacity:0;transition:opacity .25s}
#saveState.on{opacity:1}
main{padding:20px 24px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card+.card{margin-top:16px}
.card h2{font-size:15px;margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>.f{display:flex;flex-direction:column;gap:4px;min-width:130px}
.row>.f.grow{flex:1}
label.l,.f>label{font-size:12px;color:var(--muted);font-weight:500}
.inp,select.inp,textarea.inp{height:36px;border:1px solid #C3CAD6;border-radius:6px;padding:0 10px;background:#fff;width:100%}
textarea.inp{height:auto;padding:8px 10px;resize:vertical;min-height:64px}
.inp:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.inp:disabled{background:var(--soft);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;border:1px solid #C3CAD6;background:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn:focus-visible,.nav button:focus-visible,.lnk:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1405;font-weight:600}
.btn.gold:hover{background:#B88B2E}
.btn.danger{color:var(--red);border-color:#E3B7B2}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--ink);font-weight:600;cursor:pointer;text-align:right}
.lnk:hover{color:var(--blue);text-decoration:underline}
small,.muted{color:var(--muted)}
small{font-size:12px}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--navy)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat small{display:block;margin-bottom:2px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat.hl{border-color:var(--gold);background:var(--gold-soft)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--soft);border:1px solid var(--line)}
.tag.green{background:var(--green-soft);border-color:#B7DED3;color:#14594A}
.tag.red{background:var(--red-soft);border-color:#EBC3BE;color:#8C2920}
.tag.gold{background:var(--gold-soft);border-color:#E8D29B;color:#6B4E10}
.tag.blue{background:var(--blue-soft);border-color:#BED0EC;color:#22488A}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:calc(100vh - 290px)}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid #E7EAF0;text-align:right;white-space:nowrap}
.tbl thead th{background:#EEF1F6;font-weight:600;font-size:12.5px;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}
.tbl thead tr.grp th{top:0;text-align:center;background:#E3E8F0;color:var(--muted);font-size:12px}
.tbl thead tr.sub th{top:29px}
.tbl td.n,.tbl th.n{text-align:center}
.tbl tbody tr:hover td{background:#FAFBFD}
.tbl tbody tr.has td{background:#FFFBEF}
.tbl tbody tr.has:hover td{background:#FFF7DF}
.tbl .stk{position:sticky;right:0;background:#fff;z-index:2;border-left:1px solid var(--line)}
.tbl thead .stk{z-index:4;background:#EEF1F6}
.tbl tbody tr.has .stk{background:#FFFBEF}
.tbl tfoot td{position:sticky;bottom:0;background:#EEF1F6;font-weight:600;border-top:1px solid var(--line)}
.tbl td input.num::placeholder{color:#C2C9D6}
.tbl td input.num{width:56px;height:30px;text-align:center;border:1px solid transparent;background:var(--soft);border-radius:5px;padding:0 4px}
.tbl td input.num:hover{border-color:#C3CAD6}
.tbl td input.num:focus{outline:2px solid var(--blue);background:#fff}
.tbl td input.num:disabled{background:transparent;color:var(--ink)}
.tbl td select.st{height:30px;border:1px solid #C3CAD6;border-radius:5px;background:#fff;padding:0 4px;max-width:108px}
.neg{color:var(--red)} .pos{color:var(--green)}
.bar{height:8px;border-radius:99px;background:#E1E6EE;overflow:hidden;min-width:140px}
.bar i{display:block;height:100%;background:var(--green)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px;font-size:17px}
.empty .row{justify-content:center;margin-top:16px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:100}
.md{background:#fff;border-radius:10px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.md.wide{max-width:900px}
.md header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.md header h2{font-size:16px}
.md .x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 8px}
.md .bd{padding:16px 18px}
.md footer{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 10px 10px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.sum{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.sum div.t{border-top:1px solid var(--line);margin-top:4px;padding-top:7px;font-weight:700}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 12px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px;font-size:14px}
.chip button:hover{color:var(--red)}
.chip em{font-style:normal;font-size:12px;color:var(--muted)}
#toasts{position:fixed;bottom:56px;left:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:340px}
.toast.err{background:var(--red)} .toast.ok{background:var(--green)}
#lock{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:300}
#lock[hidden]{display:none}
#lock .box{background:#fff;padding:26px;border-radius:12px;width:320px;text-align:center}
.menu{position:relative}
.menu .pop{display:none;position:absolute;top:40px;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);min-width:210px;z-index:30;padding:6px}
.menu.open .pop{display:block}
.menu .pop button{display:block;width:100%;text-align:right;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu .pop button:hover{background:var(--soft)}
/* report */
.rep-head{text-align:center;margin-bottom:14px}
.rep-head h2{font-size:18px;margin:0}
.rep-head p{margin:2px 0;color:var(--muted)}
.rep-branch{margin-top:18px;break-inside:avoid-page}
.rep-branch h3{font-size:14px;background:var(--navy);color:#fff;padding:6px 12px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between}
table.rt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;background:#fff}
.rt th,.rt td{border:1px solid #CBD2DD;padding:5px 7px;text-align:center}
.rt th{background:#EEF1F6;font-weight:600;font-size:12px}
.rt td.tx{text-align:right}
.rt tr.sub td{background:#F4EAD0;font-weight:700}
.rt tr.grand td{background:var(--navy);color:#fff;font-weight:700}
.rt td.z{color:#9AA4B4}
.rt tr{break-inside:avoid}
.rt thead{display:table-header-group}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static}
  .brand{padding:12px 14px}
  .nav{flex-direction:row;overflow:auto;padding:8px}
  .nav button{white-space:nowrap}
  .side .foot{display:none}
  main{padding:14px 12px 50px}
  .top{padding:10px 12px;position:static}
  .tbl-wrap{max-height:none}
}
@media print{
  body{background:#fff;font-size:11px}
  .side,.top,.no-print,#toasts{display:none!important}
  main{padding:0}
  .card{border:0;padding:0}
  .rt{font-size:9.5px}
  .rt th,.rt td{padding:3px 4px}
  .rep-branch h3{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rt th,.rt tr.sub td,.rt tr.grand td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.supportbar{position:fixed;bottom:0;right:0;left:0;height:42px;background:var(--navy);color:#C5D0E2;display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;z-index:60;border-top:2px solid var(--gold)}
.supportbar b{color:#fff}
.supportbar a{color:var(--gold);font-weight:700;text-decoration:none;direction:ltr;unicode-bidi:embed;letter-spacing:.5px}
.supportbar a:hover{text-decoration:underline}
.notice{border-color:var(--gold);background:var(--gold-soft);margin-bottom:16px}
.notice .btn{margin-right:8px}
.entry-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
.entry-top .card+.card{margin-top:0}
#draftCard,#logCard{margin-top:16px}
.two-eq{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px;align-items:start}
.two-eq .card+.card{margin-top:0}
@media(max-width:980px){.entry-top,.two-eq{grid-template-columns:1fr}}
.inp.lg{height:44px;font-size:16px}
.ac{position:relative}
.aclist{position:absolute;top:46px;right:0;left:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:40;overflow:hidden}
.aclist button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:#fff;padding:10px 14px;text-align:right;cursor:pointer;border-bottom:1px solid #EEF1F5}
.aclist button:hover,.aclist button.on{background:var(--gold-soft)}
.selchip{display:inline-flex;align-items:center;gap:10px;margin-top:8px;background:var(--green-soft);border:1px solid #B7DED3;border-radius:8px;padding:6px 8px 6px 12px}
.selchip button{border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted);line-height:1}
.inline{display:flex;gap:6px}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.prev{background:var(--soft);border:1px dashed #BFC8D6;border-radius:8px;padding:9px 12px;font-size:13.5px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.mini>div{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mini small{display:block}
.mini b{font-size:15px}
.menu .pop label{display:flex;padding:7px 10px;border-radius:6px}
.menu .pop label:hover{background:var(--soft)}
.brpop{max-height:320px;overflow:auto;min-width:240px}
.allb{border-bottom:1px solid var(--line);margin-bottom:4px;font-weight:600}
.amts{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.amt{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px}
.amt label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px;color:var(--ink)}
.amt .inp{text-align:center;font-size:16px;height:40px}
.btns{display:flex;flex-direction:row!important;gap:10px;flex-wrap:wrap}
.btns .btn{height:42px;justify-content:center}
.btns .btn.primary{flex:1;min-width:190px}
.sumline{background:var(--gold-soft);border:1px solid #E8D29B;border-radius:8px;padding:9px 12px;font-weight:600;font-size:13.5px;line-height:1.7}
.tbl td.wrapc{white-space:normal;min-width:190px}
.rt td.sm{font-size:11.5px;min-width:150px;white-space:normal;text-align:right}
.rt td.tx{white-space:normal}
@media print{.supportbar{display:none!important}body{padding-bottom:0}}
</style>
</head>
<body>
<div id="lock" hidden>
  <div class="box">
    <h2 style="margin-bottom:6px">النظام مقفل</h2>
    <p class="muted" style="margin:0 0 14px">أدخل كلمة المرور للمتابعة</p>
    <input id="lockPw" type="password" class="inp" placeholder="كلمة المرور" autocomplete="current-password">
    <p id="lockErr" style="color:var(--red);min-height:22px;margin:6px 0"></p>
    <button id="lockBtn" class="btn primary" style="width:100%;justify-content:center">دخول</button>
  </div>
</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 38 34H2Z" fill="#C79A3B"/><path d="M20 4 38 34H20Z" fill="#A87E26"/><path d="M20 15 29 30H11Z" fill="#16233B"/></svg>
      <div><b id="brandName">صالة الهرم التجارية</b><span>الرواتب والموارد البشرية</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">البيانات محفوظة في هذا المتصفح فقط<br><span id="lastBk"></span></div>
  </aside>
  <div class="wrap">
    <header class="top"><h1 id="pageTitle"></h1><span class="sp"></span><span id="saveState">✓ تم الحفظ</span></header>
    <main id="main"></main>
  </div>
</div>
<div class="supportbar">الدعم الفني: <b>المهندس صلاح غالب</b> <span>·</span> <a href="tel:0556321436">0556321436</a></div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<script>
(function(){
'use strict';
/* ============ الحالة والتخزين ============ */
const KEY='hr_payroll_v3',OLDKEY='hr_payroll_v2';
const OLD_COMPANY='شركة صالة الهرم التجارية';
const DEF={company:'صالة الهرم التجارية',startDay:26,divisor:'month',base:'netIns',sickPct:0,annualPct:0,unpaidPct:100,branches:[],nats:[],pin:'',lastBackup:''};
const freshDB=()=>({settings:Object.assign({},DEF,{branches:[],nats:[]}),employees:[],events:[],draft:[],ui:{}});
function normDB(d){
  const f=freshDB();d=d||{};
  d.settings=Object.assign(f.settings,d.settings||{});
  if(d.settings.company===OLD_COMPANY)d.settings.company=DEF.company;
  if(!['month','30'].includes(d.settings.divisor))d.settings.divisor='month';
  d.employees=Array.isArray(d.employees)?d.employees:[];
  d.events=Array.isArray(d.events)?d.events:[];
  d.draft=Array.isArray(d.draft)?d.draft:[];
  d.ui=d.ui||{};
  ['periods','records'].forEach(k=>delete d[k]);
  return d;
}
let DB;
try{
  const s=localStorage.getItem(KEY)||localStorage.getItem(OLDKEY);
  DB=s?normDB(JSON.parse(s)):freshDB();
}catch(e){console.error(e);DB=freshDB()}
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const UI={page:'dash',sel:null,eDate:todayISO(),eType:'absent',dp:'cur',log:null,empQ:'',empBranch:'',empState:'active',rep:null};
let saveT;
function save(now){
  clearTimeout(saveT);
  const go=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));const s=$('#saveState');s.classList.add('on');clearTimeout(s._t);s._t=setTimeout(()=>s.classList.remove('on'),1400)}catch(e){toast('تعذّر الحفظ: التخزين في المتصفح معطّل أو ممتلئ','err')}};
  now?go():(saveT=setTimeout(go,250));
}
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}});

/* ============ أدوات ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const S=()=>DB.settings;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AD='٠١٢٣٤٥٦٧٨٩';
const num=v=>{if(v===''||v==null)return 0;const x=parseFloat(String(v).replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/٫/g,'.').replace(/,/g,''));return isNaN(x)?0:x};
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const fmt=x=>(+x||0).toLocaleString('en-US',{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pd=s=>new Date(s+'T00:00:00');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=s=>s?s.split('-').reverse().join('/'):'';
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5)+1;
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const dayName=s=>s?DAYS[pd(s).getDay()]:'';
const cmpAr=(a,b)=>String(a).localeCompare(String(b),'ar');
const emp=id=>DB.employees.find(e=>e.id===id);
function toast(m,t){const el=document.createElement('div');el.className='toast '+(t||'');el.textContent=m;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),t==='err'?5500:2800)}

/* ============ أنواع الحركات والحساب ============ */
const TYPES={
  absent:{l:'غياب',u:'يوم',days:true,cls:'red'},
  annual:{l:'إجازة سنوية',u:'يوم',days:true,cls:'blue'},
  sick:{l:'إجازة مرضية',u:'يوم',days:true,cls:'gold'},
  unpaid:{l:'إجازة بدون راتب',u:'يوم',days:true,cls:'gold'},
  deficit:{l:'عجز',u:'ر.س',days:false,cls:'red'}
};
function sumText(t){const o=[];['absent','unpaid','annual','sick'].forEach(k=>{if(num(t[k]))o.push(`${fmt(t[k])} يوم ${TYPES[k].l}`)});if(num(t.deficit))o.push(`${fmt(t.deficit)} عجز`);return o.join(' + ')}
const ORDER=['absent','unpaid','annual','sick','deficit'];
const typeTag=t=>`<span class="tag ${TYPES[t].cls}">${TYPES[t].l}</span>`;
const qtyText=ev=>fmt(ev.qty)+' '+TYPES[ev.type].u;
function baseOf(e){const b=S().base;return b==='basic'?num(e.basic):b==='total'?num(e.total):num(e.total)-num(e.ins)}
function rateFor(e,date){
  const d=pd(date);const div=S().divisor==='30'?30:new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return {rate:baseOf(e)/div,div};
}
function evDed(e,ev){
  const q=num(ev.qty);if(ev.type==='deficit')return r2(q);
  const pct={absent:100,unpaid:S().unpaidPct,annual:S().annualPct,sick:S().sickPct}[ev.type];
  return r2(q*rateFor(e,ev.date).rate*pct/100);
}
const monthsFactor=(from,to)=>Math.max(1,Math.round(daysBetween(from,to)/30.44));
function buildRows(from,to){
  const mf=monthsFactor(from,to);const by={};
  DB.events.forEach(v=>{if(v.date>=from&&v.date<=to)(by[v.eid]=by[v.eid]||[]).push(v)});
  const rows=[];
  for(const e of DB.employees){
    const list=by[e.id]||[];if(!e.active&&!list.length)continue;
    const R={e,total:num(e.total)*mf,basic:num(e.basic)*mf,housing:num(e.housing)*mf,allow:num(e.allow)*mf,ins:num(e.ins)*mf,absent:0,annual:0,sick:0,unpaid:0,absVal:0,deficit:0,owed:0,dedSal:0,net:0,note:'',cnt:list.length};
    const notes=[];
    list.forEach(v=>{
      const d=evDed(e,v);
      if(v.type==='deficit')R.deficit+=d;else{R[v.type]+=num(v.qty);R.absVal+=d}
      if(v.note)notes.push(fd(v.date)+': '+v.note);
    });
    R.owed=R.absVal+R.deficit;R.dedSal=R.owed;R.net=Math.max(0,R.total-R.ins-R.owed);R.note=notes.join(' | ');
    for(const k of Object.keys(R))if(typeof R[k]==='number')R[k]=r2(R[k]);
    R.summary=sumText(R);
    rows.push(R);
  }
  return rows;
}
function presets(){
  const s=num(S().startDay)||1,n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const cyc=off=>{if(s===1)return {from:iso(new Date(y,m+off,1)),to:iso(new Date(y,m+off+1,0))};const b=n.getDate()>=s?m:m-1;return {from:iso(new Date(y,b+off,s)),to:iso(new Date(y,b+off+1,s-1))}};
  const L=(t,r)=>`${t} (${fd(r.from)} - ${fd(r.to)})`;
  const a=cyc(0),b=cyc(-1);
  const out=[Object.assign({k:'cur',label:L(s===1?'هذا الشهر':'دورة الراتب الحالية',a)},a),Object.assign({k:'prev',label:L(s===1?'الشهر الماضي':'دورة الراتب السابقة',b)},b)];
  if(s!==1){const c={from:iso(new Date(y,m,1)),to:iso(new Date(y,m+1,0))},d={from:iso(new Date(y,m-1,1)),to:iso(new Date(y,m,0))};out.push(Object.assign({k:'m0',label:L('هذا الشهر',c)},c),Object.assign({k:'m1',label:L('الشهر الماضي',d)},d))}
  return out;
}
const preset=k=>presets().find(p=>p.k===k)||presets()[0];

function addDraft(keep){
  const e=emp(UI.sel);if(!e)return toast('اختر الموظف أولًا','err');
  const a=readAmts();const ks=ORDER.filter(k=>a[k]>0);
  if(!ks.length)return toast('اكتب غيابًا أو عجزًا أو إجازة على الأقل','err');
  if(!UI.eDate)return toast('اختر التاريخ','err');
  const dup=ks.filter(k=>DB.events.some(v=>v.eid===e.id&&v.date===UI.eDate&&v.type===k)||DB.draft.some(v=>v.eid===e.id&&v.date===UI.eDate&&v.type===k));
  const doAdd=()=>{
    const note=$('#en').value.trim();
    ks.forEach(k=>DB.draft.push({id:uid(),eid:e.id,date:UI.eDate,type:k,qty:a[k],note}));
    save(true);
    $$('[data-t]').forEach(i=>i.value='');$('#en').value='';

    renderInfo();renderPrev();renderDraft();

    keep?$('[data-t="absent"]').focus():$('#es').focus();
  };
  if(dup.length)confirmBox(`يوجد مسبقًا (${dup.map(k=>TYPES[k].l).join('، ')}) لنفس الموظف بتاريخ ${fd(UI.eDate)}. هل تريد إضافتها مرة أخرى؟`,'إضافة مرة أخرى',doAdd);
  else doAdd();
}
function bindEntry(){
  main.oninput=e=>{
    const t=e.target;

    if(t.dataset.t){renderPrev();return}
    if(t.id==='lq'){UI.log.q=t.value;renderLogTable()}
  };
  main.onchange=e=>{
    const t=e.target;
    if(t.id==='ed'){UI.eDate=t.value||todayISO();$('#edn').textContent=dayName(UI.eDate);renderPrev();renderInfo();return}
    const m={lf:'from',lt:'to',lb:'branch',ly:'type'}[t.id];if(m){UI.log[m]=t.value;renderLogTable()}
  };
  main.onkeydown=e=>{
    const t=e.target;
    if(t.id==='es'){
      if(e.key==='ArrowDown'){e.preventDefault();acIdx=Math.min(acIdx+1,acIds.length-1);renderAC()}

  };

    ({today:()=>{UI.eDate=todayISO();$('#ed').value=UI.eDate;$('#edn').textContent=dayName(UI.eDate);renderPrev();renderInfo()},
      unsel:()=>{UI.sel=null;$('#selChip').innerHTML='';renderInfo();renderPrev();$('#es').focus()},

      clr:()=>confirmBox('تفريغ قائمة الإدخال دون حفظ؟','تفريغ',()=>{DB.draft=[];save(true);renderDraft();renderInfo()},true),
      undo:()=>{const lb=(DB.ui.lastBatch||[]).filter(id=>DB.events.some(v=>v.id===id));confirmBox(`سيتم حذف ${lb.length} حركة حُفظت في آخر عملية حفظ. هل تريد التراجع؟`,'تراجع',()=>{DB.events=DB.events.filter(v=>!lb.includes(v.id));DB.ui.lastBatch=[];save(true);renderLogCard();renderInfo();toast('تم التراجع عن آخر حفظ','ok')},true)},
      save:()=>{
        const n=DB.draft.length;if(!n)return;const ids=DB.draft.map(v=>v.id);
        DB.draft.forEach(v=>DB.events.push({id:v.id,eid:v.eid,date:v.date,type:v.type,qty:v.qty,note:v.note||'',ts:Date.now()}));

function importEmployeesXL(buf){

  let rows;try{const wb=XLSX.read(buf,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}catch(e){return toast('تعذّر قراءة الملف','err')}

  const H=rows[hi].map(c=>String(c).replace(/\s+/g,' ').trim());
  const col=re=>H.findIndex(h=>re.test(h));
  const c={name:col(/اسم/),nid:col(/هوية|إقامة/),nat:col(/جنس/),br:col(/فرع/),total:col(/^الراتب$|إجمالي الراتب/),basic:col(/أساسي|اساسي/),hous:col(/سكن/),allow:col(/أخرى|اخرى/),ins:col(/تأمين|تامين/)};
  const nb=s=>String(s||'').replace(/\s+/g,' ').trim().replace(/(?<=[^\d\s])(\d)/g,' $1');

    const basic=num(r[c.basic]),housing=num(r[c.hous]),allow=num(r[c.allow]);
    out.push({id:uid(),no:0,name,nid,nat:String(r[c.nat]||'').trim(),branch:nb(r[c.br]),basic,housing,allow,total:basic+housing+allow||num(r[c.total]),ins:num(r[c.ins]),join:'',phone:'',active:true,note:''});
  });

  confirmBox(`تم العثور على <b>${out.length}</b> موظف جديد${dup?` (وتجاهل ${dup} مكرر)`:''}. هل تريد إضافتهم؟`,'إضافة الموظفين',()=>{
    let n=Math.max(0,...DB.employees.map(x=>+x.no||0));out.forEach(e=>{e.no=++n;DB.employees.push(e);addToList('nats',e.nat);addToList('branches',e.branch)});

  });

function reportModel(){
  const R=UI.rep,def=REPORTS[R.type];let rows;
  if(def.log){
    rows=[];DB.events.filter(v=>v.date>=R.from&&v.date<=R.to).forEach(v=>{const e=emp(v.eid);if(!e||!inBranch(e,R))return;
      rows.push({e,_d:v.date,date:fd(v.date)+' '+dayName(v.date),typeL:TYPES[v.type].l,qty:qtyText(v),ded:evDed(e,v),note:v.note||''})});
  }else{
    rows=buildRows(R.from,R.to).filter(r=>inBranch(r.e,R));
    if(R.hideIdle&&def.idle)rows=rows.filter(r=>def.idle.some(k=>Math.abs(r[k])>0.0001));
  }
  const keys=def.cols.filter(k=>CD[k][1]!=='t');
  const sum=list=>{const o={};keys.forEach(k=>o[k]=r2(list.reduce((a,r)=>a+r[k],0)));return o};
  const gm={};rows.forEach(r=>{const b=r.e.branch||'بدون فرع';(gm[b]=gm[b]||[]).push(r)});
  const groups=Object.keys(gm).sort((a,b)=>branchOrder(a)-branchOrder(b)||cmpAr(a,b)).map(b=>({branch:b,rows:gm[b].sort((x,y)=>def.log?((x._d||'').localeCompare(y._d||'')||cmpAr(x.e.name,y.e.name)):cmpAr(x.e.name,y.e.name)),total:sum(gm[b])}));
  const emps=new Set(rows.map(r=>r.e.id)).size;

}

  const counts=key=>{const c={};DB.employees.forEach(e=>{const v=key==='branches'?e.branch:e.nat;c[v]=(c[v]||0)+1});return c};
  const chipList=key=>{const c=counts(key);const all=[...new Set([...s[key],...Object.keys(c)])].filter(Boolean);
    return all.map(x=>`<span class="chip" data-v="${esc(x)}">${esc(x)} ${c[x]?`<em>${c[x]}</em>`:''}<button data-a="ren" title="إعادة تسمية">✎</button><button data-a="rm" title="حذف">×</button></span>`).join('')||'<span class="muted">لا توجد عناصر</span>'};
  const sel=(k,v,list)=>`<select class="inp" data-s="${k}">${list.map(([a,b])=>`<option value="${a}" ${String(v)===String(a)?'selected':''}>${b}</option>`).join('')}</select>`;
  main.innerHTML=`
  <div class="card"><h2>بيانات الشركة</h2><div class="row"><div class="f grow"><label>اسم الشركة (يظهر في التقارير)</label><input class="inp" data-s="company" value="${esc(s.company)}"></div>
    <div class="f"><label>يوم بداية دورة الراتب</label><input class="inp" type="number" min="1" max="28" data-s="startDay" value="${s.startDay}"></div></div>
    <p class="muted" style="margin:8px 0 0;font-size:13px">مثال: 26 تعني أن الدورة تبدأ يوم 26 وتنتهي يوم 25 من الشهر التالي، وتظهر كفترة جاهزة في التقارير. 1 تعني الشهر الميلادي كاملًا.</p></div>
  <div class="card"><h2>قواعد الحساب</h2><div class="row">
    <div class="f"><label>قيمة يوم الغياب = الراتب ÷</label>${sel('divisor',s.divisor,[['month','عدد أيام شهر الحركة الفعلية (28/29/30/31)'],['30','30 يومًا ثابتة']])}</div>
    <div class="f"><label>الراتب المعتمد لحساب الغياب</label>${sel('base',s.base,[['netIns','الإجمالي بعد خصم التأمينات'],['total','الراتب الإجمالي'],['basic','الراتب الأساسي فقط']])}</div></div>
    <div class="row" style="margin-top:12px">
    <div class="f"><label>خصم الإجازة المرضية (%)</label><input class="inp" type="number" min="0" max="100" data-s="sickPct" value="${s.sickPct}"></div>
    <div class="f"><label>خصم الإجازة السنوية (%)</label><input class="inp" type="number" min="0" max="100" data-s="annualPct" value="${s.annualPct}"></div>
    <div class="f"><label>خصم الإجازة بدون راتب (%)</label><input class="inp" type="number" min="0" max="100" data-s="unpaidPct" value="${s.unpaidPct}"></div></div>
    <p class="muted" style="margin:8px 0 0;font-size:13px">يُحسب خصم كل حركة بحسب تاريخها: إذا كانت الحركة في شهر 31 يومًا فالقسمة على 31. العجز يُسجَّل بمبلغه كما هو. أي تغيير هنا يُعاد به حساب كل التقارير تلقائيًا.</p></div>
  <div class="card"><h2>الفروع</h2><div class="chips" id="ch-branches">${chipList('branches')}</div><div class="row" style="margin-top:10px"><div class="f grow"><input class="inp" id="nb" placeholder="اسم فرع جديد"></div><button class="btn" data-a="addb">إضافة فرع</button></div></div>
  <div class="card"><h2>الجنسيات</h2><div class="chips" id="ch-nats">${chipList('nats')}</div><div class="row" style="margin-top:10px"><div class="f grow"><input class="inp" id="nn" placeholder="جنسية جديدة"></div><button class="btn" data-a="addn">إضافة جنسية</button></div></div>
  <div class="card"><h2>النسخ الاحتياطي</h2><p class="muted" style="margin:0 0 10px">كل بياناتك تُحفظ داخل هذا المتصفح على هذا الجهاز فقط، ولا تُرسل إلى أي خادم. احفظ نسخة منتظمة، وهي أيضًا وسيلة نقل البيانات بين جهازين.</p>
    <div class="row"><button class="btn primary" data-a="bk">حفظ نسخة احتياطية (JSON)</button><button class="btn" data-a="rs">استعادة نسخة (يستبدل البيانات الحالية)</button><button class="btn danger" data-a="wipe">مسح كل البيانات</button></div></div>
  <div class="card"><h2>كلمة مرور الدخول</h2><p class="muted" style="margin:0 0 10px">تمنع فتح النظام على هذا الجهاز دون كلمة المرور. هي حماية بسيطة وليست تشفيرًا للبيانات.</p>
    <div class="row"><div class="f"><label>${s.pin?'تغيير كلمة المرور':'كلمة مرور جديدة'}</label><input class="inp" type="password" id="pw" autocomplete="new-password"></div><button class="btn" data-a="setpw">حفظ</button>${s.pin?'<button class="btn danger" data-a="rmpw">إزالة كلمة المرور</button>':''}</div></div>`;
  const rebuild=()=>{['branches','nats'].forEach(k=>{const el=$('#ch-'+k);if(el)el.innerHTML=chipList(k)})};
  main.oninput=main.onchange=e=>{
    const t=e.target,k=t.dataset.s;if(!k)return;
    s[k]=['startDay','sickPct','annualPct','unpaidPct'].includes(k)?num(t.value):t.value;
    if(k==='startDay'&&!s[k])s[k]=1;
    if(k==='startDay'){UI.rep=null;UI.log=null}
    save();if(k==='company')$('#brandName').textContent=s.company;
  };
  main.onclick=e=>{
    const a=e.target.closest('[data-a]');if(!a)return;const chip=a.closest('.chip');const list=chip&&chip.parentElement.id.slice(3);const v=chip&&chip.dataset.v;
    const add=(inp,key)=>{const x=$(inp).value.trim();if(!x)return;if(!s[key].includes(x))s[key].push(x);$(inp).value='';save(true);rebuild()};
    ({addb:()=>add('#nb','branches'),addn:()=>add('#nn','nats'),
     rm:()=>{const used=DB.employees.filter(x=>(list==='branches'?x.branch:x.nat)===v).length;
       if(used)return toast(`لا يمكن الحذف: ${used} موظف مرتبطون بهذا العنصر. غيّر بياناتهم أولًا أو أعد تسميته لدمجه.`,'err');
       s[list]=s[list].filter(x=>x!==v);save(true);rebuild()},
     ren:()=>{const n=(prompt('الاسم الجديد',v)||'').trim();if(!n||n===v)return;
       DB.employees.forEach(x=>{if(list==='branches'&&x.branch===v)x.branch=n;if(list==='nats'&&x.nat===v)x.nat=n});
       s[list]=[...new Set(s[list].map(x=>x===v?n:x))];save(true);rebuild();toast('تمت إعادة التسمية','ok')},
     bk:exportBackup,rs:()=>pickFile('.json',importBackup),
     wipe:()=>confirmBox('سيتم حذف كل الموظفين والحركات والإعدادات من هذا المتصفح. احفظ نسخة احتياطية أولًا. هل أنت متأكد؟','مسح كل شيء',()=>{DB=freshDB();save(true);UI.rep=null;UI.log=null;UI.sel=null;go('dash')},true),
     setpw:async()=>{const p=$('#pw').value;if(p.length<4)return toast('كلمة المرور 4 أحرف على الأقل','err');s.pin=await sha(p);sessionStorage.setItem('unlocked','1');save(true);render();toast('تم حفظ كلمة المرور','ok')},
     rmpw:()=>{s.pin='';save(true);render();toast('تمت إزالة كلمة المرور','ok')}
    })[a.dataset.a]();
  };
}
function exportBackup(){
  S().lastBackup=todayISO();save(true);
  download(`نسخة-الرواتب-${todayISO()}.json`,new Blob([JSON.stringify(DB)],{type:'application/json'}));
  render();toast('تم حفظ النسخة الاحتياطية','ok');
}
function importBackup(text){
  let d;try{d=JSON.parse(text)}catch(e){return toast('الملف غير صالح','err')}
  if(!d||!Array.isArray(d.employees))return toast('هذا ليس ملف نسخة احتياطية للنظام','err');
  confirmBox(`النسخة تحتوي على <b>${d.employees.length}</b> موظف و<b>${(d.events||[]).length}</b> حركة. سيتم استبدال كل البيانات الحالية بها.`,'استعادة',()=>{DB=normDB(d);save(true);UI.rep=null;UI.log=null;UI.sel=null;render();toast('تمت الاستعادة','ok')});
}

/* ============ القفل ============ */
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hr:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h}}
function initLock(){
  if(!S().pin||sessionStorage.getItem('unlocked')){render();return}
  const L=$('#lock');L.hidden=false;$('#lockPw').focus();
  const tryIt=async()=>{if(await sha($('#lockPw').value)===S().pin){sessionStorage.setItem('unlocked','1');L.hidden=true;render()}else{$('#lockErr').textContent='كلمة المرور غير صحيحة';$('#lockPw').select()}};
  $('#lockBtn').onclick=tryIt;$('#lockPw').onkeydown=e=>{if(e.key==='Enter')tryIt()};
}
initLock();
})();
</script>
</body>
</html>
